name: docker-compose.yml-microservices
version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - network-monitoring
    ports:
      - "9090:9090"
  
  grafana:
    image: grafana/grafana:latest
    networks:
      - network-monitoring
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

networks:
  network-monitoring:
    driver: bridge