name: docker-compose.yml-microservices
version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml # Prometheus carrega as regras de alerta do arquivo alert.rules.yml
    networks:
      - network-monitoring
    ports:
      - "9090:9090"
  
  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./grafana/provisioning/:/etc/grafana/provisioning
      - grafana-storage:/var/lib/grafana
    networks:  
      - network-monitoring
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:latest
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml.template
    # Comando para substituir variáveis de ambiente no arquivo de configuração antes de iniciar o Alertmanager
    entrypoint: ["/bin/sh", "-c", "sed 's|$${SLACK_WEBHOOK_URL}|'\"$$SLACK_WEBHOOK_URL\"'|g' /etc/alertmanager/alertmanager.yml.template > /etc/alertmanager/alertmanager.yml && exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml"]
    networks:
      - network-monitoring
    ports:
      - "9093:9093"
    depends_on:
      - prometheus

  rabbitmq:
    image: rabbitmq:3.10-management
    ports:
      - "5672:5672" # AMQP Protocol
      - "15672:15672" # Management UI

volumes:
  grafana-storage:      

networks:
  network-monitoring:
    driver: bridge