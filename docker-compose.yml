name: docker-compose.yml-microservices
version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - network-monitoring
    ports:
      - "9090:9090"
  
  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./grafana/provisioning/:/etc/grafana/provisioning
    networks:  
      - network-monitoring
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  rabbitmq:
    image: rabbitmq:3.10-management
    ports:
      - "5672:5672" # AMQP Protocol
      - "15672:15672" # Management UI

volumes:
  grafana-storage:      

networks:
  network-monitoring:
    driver: bridge