global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'microservices-architecture-java' # grupo de serviços - melhor visualizacao no grafana
    static_configs: # configuração do job_name
      - targets: ['host.docker.internal:9001'] # endereço do pedidos-service
        labels:
          application: 'pedidos-service' # nome do serviço {application=pedidos-service}
      - targets: ['host.docker.internal:9002'] # endereço do pagamentos-service
        labels:
          application: 'pagamentos-service' # nome do serviço {application=pagamentos-service}
      - targets: ['host.docker.internal:9003'] # endereço do inventario-service
        labels:
          application: 'inventario-service' # nome do serviço {application=inventario-service}
      - targets: ['host.docker.internal:9004'] # endereço do notificacoes-service
        labels:
          application: 'notificacoes-service' # nome do serviço {application=notificacoes-service}
    metrics_path: '/actuator/prometheus' # endpoint do prometheus no spring boot

rule_files:
  - 'etc/prometheus/alert.rules.yml' # arquivo de regras de alerta

# enviando métricas do prometheus para o alertmanager, quando uma condicao de alerta for atendida
alerting:
  alertmanagers:
    - static_configs:
      - targets: ['alertmanager:9093'] # endereço do alertmanager