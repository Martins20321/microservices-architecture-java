spring.application.name=auth-service

# Banco de dados para armazenar dados dos usuarios
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_service
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456789}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Eureka
eureka.instance.instance-id=${spring.application.name}:${random.int}
eureka.serviceUrl.default=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator - exposure prometheus endpoints
management.server.port=9005
management.endpoints.web.exposure.include=health,info,prometheus

# Grafana - enabling the histogram
management.metrics.distribution.percentiles-histogram.http.server.requests=true
server.port=0

# Keys - RSA (Classpath)
jwt.private-key=${JWT_PRIVATE_KEY_PATH:classpath:keys/private_key.pem}
jwt.public-key=${JWT_PUBLIC_KEY_PATH:classpath:keys/public_key.pem}